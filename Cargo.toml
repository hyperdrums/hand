[package]
name = "hand"
version = "0.1.0"
edition = "2024"

[features]
default = []
log-ui = []

[dependencies]
arboard = "3.6"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
] }
windows-icons = "0.4"

[build-dependencies]
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"
